{% extends 'base.html' %}
{% load static %}

{% block content %}
    <!-- **************** MAIN CONTENT START **************** -->
    <main>

        <!-- =======================
        Main Content START -->
        <section class="auth-page">
            <!-- Information -->
           <!-- Logo -->
            <a href="{% url 'index' %}">
                <img class="h-50px mb-4" src="{% static "img/Ready-stock/Logo/AIM_logo-colored.png" %}" alt="logo">
            </a>
            <!-- Title -->
            <h1 class="mb-2 h3">Добре дошъл!</h1>
            {# <p class="mb-0">Нямаш профил?<a href="{% url 'sign up' %}"> Регистрирай се</a></p> #}

            <form class="text-start" method="post" action="{% url 'sign in' %}">
                {% csrf_token %}
                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Въведи e-mail:
                        {{ form.username }}</label>
                </div>
                <!-- Password -->
                <div class="mb-3 position-relative">
                    <label class="form-label">Въведи парола:
                        {{ form.password }} </label>
                    <span class="position-absolute top-50 end-0 translate-middle-y p-0 mt-3">
											<i class="fakepasswordicon fas fa-eye-slash cursor-pointer p-2"></i>
										</span>
                </div>
                <!-- Remember me -->
                <div class="mb-3 d-sm-flex justify-content-between">
                    {#                                            <div>#}
                    {#                                                <input type="checkbox" class="form-check-input" id="rememberCheck">#}
                    {#                                                <label class="form-check-label" for="rememberCheck">Запомни ме?</label>#}
                    {#                                            </div>#}
                    <a href="{% url 'password_reset' %}">Забравена парола</a>
                </div>
                <!-- Button -->
                <div id="button">
                    <button type="submit" class="slider-btn">Вход</button>
                </div>

                <!-- Divider -->
                {#                                        <div class="position-relative my-4">#}
                {#                                            <hr>#}
                {#                                            <p class="small bg-mode position-absolute top-50 start-50 translate-middle px-2">#}
                {#                                                Или влез със</p>#}
                {#                                        </div>#}

                <!-- Google and facebook button -->
                {#                                        <div class="vstack gap-3">#}
                {#                                            <a href="#" class="btn btn-light mb-0"><i#}
                {#                                                    class="fab fa-fw fa-google text-google-icon me-2"></i>Влез с Google</a>#}
                {#                                            <a href="#" class="btn btn-light mb-0"><i#}
                {#                                                    class="fab fa-fw fa-facebook-f text-facebook me-2"></i>Влез с#}
                {#                                                Facebook</a>#}
                {#                                        </div>#}
            </form>
            <!-- Form END -->
        </section>
        <!-- =======================
        Main Content END -->

    </main>
    <!-- **************** MAIN CONTENT END **************** -->
{% endblock %}
