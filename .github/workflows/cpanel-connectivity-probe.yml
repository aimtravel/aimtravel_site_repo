# Go/no-go probe: can GitHub-hosted runners reach the cPanel UAPI on
# Superhosting? Read-only — it lists Git repos, it never pulls or deploys.
# Runs on 3 parallel runners to sample different GitHub egress IPs.
#
# Required repo secrets: CPANEL_HOST (e.g. aimtravel.bg), CPANEL_USER, CPANEL_TOKEN
name: cPanel connectivity probe

on:
  workflow_dispatch:
  push:
    branches: [feature/infra-fix-deployment-routine-create-pipeline-gh]
    paths: [.github/workflows/cpanel-connectivity-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      PORT: "2083"
      EXPECTED_REPO: /home/aimtrave/repos/aimtravel-site
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          S=$GITHUB_STEP_SUMMARY
          pass() { echo "| $1 | ✅ PASS | $2 |" >> $S; }
          fail() { echo "| $1 | ❌ FAIL | $2 |" >> $S; FAILED=1; }
          FAILED=0

          echo "## Attempt ${{ matrix.attempt }}" >> $S
          echo "| Check | Result | Detail |" >> $S
          echo "|---|---|---|" >> $S

          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USER" ] || [ -z "$CPANEL_TOKEN" ]; then
            fail "0. Secrets present" "CPANEL_HOST / CPANEL_USER / CPANEL_TOKEN missing"
            exit 1
          fi
          pass "0. Secrets present" "host=$CPANEL_HOST"

          IP=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          pass "1. Runner egress IP" "$IP"

          RESOLVED=$(getent hosts "$CPANEL_HOST" | awk '{print $1}' | head -1)
          [ -n "$RESOLVED" ] && pass "2. DNS" "$CPANEL_HOST → $RESOLVED" \
                             || { fail "2. DNS" "cannot resolve $CPANEL_HOST"; exit 1; }

          # TCP: a timeout means packets are silently dropped (firewall);
          # "refused" means the host is up but the port is closed.
          if TCP_ERR=$(timeout 15 bash -c "exec 3<>/dev/tcp/$CPANEL_HOST/$PORT" 2>&1); then
            pass "3. TCP :$PORT" "connected"
          else
            [ $? -eq 124 ] && fail "3. TCP :$PORT" "TIMEOUT — firewall is dropping GitHub IPs" \
                           || fail "3. TCP :$PORT" "refused/error: $TCP_ERR"
            exit 1
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$CPANEL_HOST:$PORT/")
          [ "$CODE" = "200" ] && pass "4. TLS + login page" "HTTP $CODE" \
                              || fail "4. TLS + login page" "HTTP $CODE (expected 200)"

          # Read-only authenticated UAPI call — the same API family the
          # deploy workflow will use (VersionControl / VersionControlDeployment).
          BODY=$(curl -s --max-time 30 -w '\n%{http_code}' \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:$PORT/execute/VersionControl/retrieve")
          HTTP=$(tail -1 <<<"$BODY"); JSON=$(sed '$d' <<<"$BODY")
          STATUS=$(jq -r '.status // empty' <<<"$JSON" 2>/dev/null)
          if [ "$HTTP" = "200" ] && [ "$STATUS" = "1" ]; then
            pass "5. UAPI auth (VersionControl/retrieve)" "HTTP 200, status=1"
            REPOS=$(jq -r '.data[] | "\(.repository_root) [branch: \(.branch)]"' <<<"$JSON" | paste -sd ';' -)
            if jq -e --arg r "$EXPECTED_REPO" '.data[] | select(.repository_root == $r)' <<<"$JSON" >/dev/null; then
              pass "6. Server repo registered" "$REPOS"
            else
              fail "6. Server repo registered" "$EXPECTED_REPO not found. Repos: ${REPOS:-none}"
            fi
          else
            ERR=$(jq -r '(.errors // []) | join("; ")' <<<"$JSON" 2>/dev/null)
            fail "5. UAPI auth (VersionControl/retrieve)" "HTTP $HTTP status=${STATUS:-?} ${ERR:-$(head -c 200 <<<"$JSON")}"
          fi

          # Informational: the webhook fallback (Option 2) would use plain 443.
          C443=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://staging.aimtravel.bg/")
          echo "| 7. (info) staging :443 | ℹ️ | HTTP $C443 |" >> $S

          echo >> $S
          [ $FAILED -eq 0 ] && echo "**VERDICT: GO**" >> $S || echo "**VERDICT: NO-GO**" >> $S
          exit $FAILED
